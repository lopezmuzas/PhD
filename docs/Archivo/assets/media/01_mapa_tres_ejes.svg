<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mapa de tres ejes hacia el FRL offline sobre Ocean Protocol</title>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.th{font-size:14px;font-weight:600}
.t{font-size:14px}
.ts{font-size:12px}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
<rect x="40" y="40" width="180" height="174" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="130" y="60" text-anchor="middle" fill="#444441">Eje 1 · paradigma</text>
<text class="ts" x="130" y="76" text-anchor="middle" fill="#5F5E5A">cómo aprende</text>
<rect x="250" y="40" width="180" height="174" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="340" y="60" text-anchor="middle" fill="#444441">Eje 2 · modelo</text>
<text class="ts" x="340" y="76" text-anchor="middle" fill="#5F5E5A">con qué aproxima</text>
<rect x="460" y="40" width="180" height="174" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="550" y="60" text-anchor="middle" fill="#444441">Eje 3 · arquitectura</text>
<text class="ts" x="550" y="76" text-anchor="middle" fill="#5F5E5A">dónde están los datos</text>
<rect x="52" y="88" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="130" y="104" text-anchor="middle" fill="#444441">Supervisado</text>
<rect x="52" y="118" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="130" y="134" text-anchor="middle" fill="#444441">No supervisado</text>
<rect x="52" y="148" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="130" y="164" text-anchor="middle" fill="#444441">Auto-supervisado</text>
<rect x="52" y="178" width="156" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="130" y="194" text-anchor="middle" fill="#085041">RL offline · off-policy</text>
<rect x="262" y="88" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="340" y="104" text-anchor="middle" fill="#444441">Tablas (Q-table)</text>
<rect x="262" y="118" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="340" y="134" text-anchor="middle" fill="#444441">Árboles · GB, RF</text>
<rect x="262" y="148" width="156" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="340" y="164" text-anchor="middle" fill="#085041">Red profunda (DL)</text>
<rect x="472" y="88" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="550" y="104" text-anchor="middle" fill="#444441">Centralizado</text>
<rect x="472" y="118" width="156" height="24" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text class="ts" x="550" y="134" text-anchor="middle" fill="#444441">Distribuido</text>
<rect x="472" y="148" width="156" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="550" y="164" text-anchor="middle" fill="#085041">Federado · data space</text>
<line x1="130" y1="218" x2="240" y2="262" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="218" x2="340" y2="262" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="550" y1="218" x2="440" y2="262" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="100" y="256" width="480" height="120" rx="14" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="6 5"/>
<rect x="170" y="270" width="340" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="292" text-anchor="middle" fill="#26215C">FRL offline</text>
<text class="ts" x="340" y="310" text-anchor="middle" fill="#3C3489">deep RL federado sobre Ocean Protocol</text>
<text class="ts" x="340" y="356" text-anchor="middle" fill="#5F5E5A">Data space (Gaia-X / IDS) · gobernanza, contratos y soberanía del dato</text>
<rect x="150" y="398" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="172" y="409" fill="#444441">combinación que define el nicho de investigación</text>
</svg>
