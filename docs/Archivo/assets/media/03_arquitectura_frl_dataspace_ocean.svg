<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura objetivo: ronda de FRL offline sobre un data space con Ocean Compute-to-Data</title>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>
<rect x="40" y="40" width="600" height="340" rx="16" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="6 5"/>
<rect x="56" y="80" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="131" y="100" text-anchor="middle" fill="#444441">Ocean Protocol</text>
<text class="ts" x="131" y="120" text-anchor="middle" fill="#5F5E5A">datatokens, contratos</text>
<line x1="206" y1="108" x2="226" y2="108" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect x="230" y="80" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="100" text-anchor="middle" fill="#26215C">Orquestador FL</text>
<text class="ts" x="340" y="120" text-anchor="middle" fill="#3C3489">agrega políticas (FedAvg+)</text>
<line x1="260" y1="140" x2="133" y2="236" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="332" y1="140" x2="328" y2="236" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="404" y1="140" x2="523" y2="236" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="157" y1="236" x2="290" y2="140" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowt)"/>
<line x1="352" y1="236" x2="358" y2="140" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowt)"/>
<line x1="547" y1="236" x2="430" y2="140" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowt)"/>
<rect x="60" y="240" width="170" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="145" y="260" text-anchor="middle" fill="#085041">Proveedor A</text>
<text class="ts" x="145" y="280" text-anchor="middle" fill="#085041">trayectorias locales</text>
<text class="ts" x="145" y="298" text-anchor="middle" fill="#085041">job C2D: entrena RL</text>
<rect x="255" y="240" width="170" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="260" text-anchor="middle" fill="#085041">Proveedor B</text>
<text class="ts" x="340" y="280" text-anchor="middle" fill="#085041">trayectorias locales</text>
<text class="ts" x="340" y="298" text-anchor="middle" fill="#085041">job C2D: entrena RL</text>
<rect x="450" y="240" width="170" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="535" y="260" text-anchor="middle" fill="#085041">Proveedor C</text>
<text class="ts" x="535" y="280" text-anchor="middle" fill="#085041">trayectorias locales</text>
<text class="ts" x="535" y="298" text-anchor="middle" fill="#085041">job C2D: entrena RL</text>
<text class="ts" x="340" y="362" text-anchor="middle" fill="#5F5E5A">Data space (Gaia-X / IDS): conectores, identidad, políticas de uso</text>
<line x1="60" y1="410" x2="90" y2="410" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="98" y="414" fill="#444441">baja la política global</text>
<line x1="290" y1="410" x2="320" y2="410" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowt)"/>
<text class="ts" x="328" y="414" fill="#444441">suben solo pesos de la política (las trayectorias no salen)</text>
</svg>
