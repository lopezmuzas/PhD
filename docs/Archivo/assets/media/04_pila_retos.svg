<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pila de retos de investigación: del offline RL a Ocean Protocol</title>
<style>
text{font-family:'Helvetica Neue',Arial,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="420" fill="#FFFFFF"/>
<rect x="160" y="40" width="360" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="62" text-anchor="middle" fill="#085041">1 · Offline RL monoagente</text>
<text class="ts" x="340" y="82" text-anchor="middle" fill="#085041">distribution shift, pesimismo, evaluación OPE</text>
<line x1="340" y1="100" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="160" y="124" width="360" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="340" y="146" text-anchor="middle" fill="#712B13">2 · FRL offline (núcleo científico)</text>
<text class="ts" x="340" y="166" text-anchor="middle" fill="#993C1D">políticas de comportamiento y MDPs dispares</text>
<line x1="340" y1="184" x2="340" y2="204" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="160" y="208" width="360" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="340" y="230" text-anchor="middle" fill="#712B13">3 · Orquestación en Ocean C2D</text>
<text class="ts" x="340" y="250" text-anchor="middle" fill="#993C1D">rondas iterativas multi-proveedor</text>
<line x1="340" y1="268" x2="340" y2="288" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="160" y="292" width="360" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="340" y="314" text-anchor="middle" fill="#712B13">4 · Incentivos y gobernanza</text>
<text class="ts" x="340" y="334" text-anchor="middle" fill="#993C1D">valorar, verificar y proteger contribuciones</text>
<rect x="130" y="382" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="ts" x="152" y="393" fill="#444441">base consolidada</text>
<rect x="320" y="382" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="342" y="393" fill="#444441">frente abierto de investigación</text>
</svg>
