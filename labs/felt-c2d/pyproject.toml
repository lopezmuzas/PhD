[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feltc2d"
version = "0.1.0"
description = "Reimplementacion didactica del protocolo de FELT Labs sobre Compute-to-Data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyNaCl>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["docker: requiere un motor Docker en marcha"]
