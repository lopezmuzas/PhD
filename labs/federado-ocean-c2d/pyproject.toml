[project]
name = "fedlab"
version = "0.1.0"
description = "Aprendizaje federado sobre Ocean Protocol Compute-to-Data"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
orchestrator = ["requests>=2.32", "eth-account>=0.13", "eth-utils>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: requiere un motor Docker en marcha (deselect con -m 'not docker')"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ignorados a proposito, con motivo:
#   BLE001  - capturamos Exception al leer algoCustomData: un JSON corrupto
#             enviado por el nodo no debe tumbar el job entero.
#   PLW1510 - subprocess.run sin check en los tests: comprobamos returncode
#             nosotros para poder imprimir stdout/stderr en el assert.
ignore = ["BLE001", "PLW1510"]
