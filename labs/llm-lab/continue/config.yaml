    apiKey: sk-or-v1-TU_CLAVE
    roles: [chat]
    defaultCompletionOptions:
      contextLength: 128000
      maxTokens: 8192
    capabilities: [tool_use]

  # ==========================================================
  # NOTA ?/5 — VARIABLE
  # Auto-router y modelos propios: la potencia depende de lo que haya detras.
  # ==========================================================

  - name: "[?/5] Antonio · Modelo propio · LOCAL"
    provider: openai
    model: mi-modelo-v1
    apiBase: http://127.0.0.1:8000/v1
    apiKey: no-importa          # el cliente lo exige, tu servidor lo ignora
    roles: [chat]
    defaultCompletionOptions:
      contextLength: 4096
      maxTokens: 512
    useLegacyCompletionsEndpoint: false

  - name: "[?/5] OpenRouter · Auto Free Router · GRATIS"
