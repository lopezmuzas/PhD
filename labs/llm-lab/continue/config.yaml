  # (23)
  - name: "[2/5] NVIDIA · Nemotron 3 Nano 30B · GRATIS"
    provider: openrouter
    model: nvidia/nemotron-3-nano-30b-a3b:free
    apiBase: https://openrouter.ai/api/v1
    apiKey: sk-or-v1-TU_CLAVE
