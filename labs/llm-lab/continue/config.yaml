      maxTokens: 4096
    capabilities: [tool_use]

  # (14) Visión en formato mini.
  - name: "[1/5] NVIDIA · Nemotron Nano 12B VL (vision) · GRATIS"
    provider: openrouter
    model: nvidia/nemotron-nano-12b-v2-vl:free
    apiBase: https://openrouter.ai/api/v1
    apiKey: sk-or-v1-TU_CLAVE
    roles: [chat]
    defaultCompletionOptions:
      contextLength: 128000
      maxTokens: 8192
    capabilities: [tool_use, image_input]

  # (14)
  - name: "[1/5] NVIDIA · Nemotron Nano 9B v2 · GRATIS"
