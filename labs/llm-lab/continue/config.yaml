    provider: openrouter
    model: openai/gpt-oss-20b:free
    apiBase: https://openrouter.ai/api/v1
    apiKey: sk-or-v1-TU_CLAVE
    roles: [chat, edit]
    defaultCompletionOptions:
      contextLength: 131072
      maxTokens: 8192
    capabilities: [tool_use]

  - name: "[2/5] Poolside · Laguna XS 2.1 · GRATIS"
