    model: poolside/laguna-xs-2.1:free
    apiBase: https://openrouter.ai/api/v1
    apiKey: sk-or-v1-TU_CLAVE
    roles: [edit, apply]
    defaultCompletionOptions:
      contextLength: 262144
      maxTokens: 8192
    capabilities: [tool_use]

  # ==========================================================
  # NOTA 1/5 — MINIMO
  # Autocompletado, pruebas, y medir el suelo de calidad.
  # ==========================================================

  - name: "[1/5] Alibaba · Qwen2.5 Coder 1.5B · LOCAL (autocompletado)"
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles: [autocomplete]

  # El más pequeño del catálogo. Útil para ver dónde está el suelo de calidad.
