name: mlp_moons_baseline
seed: 42
device: auto        # auto | cuda | mps | cpu

model:
  name: mlp
  hidden: [64, 64]
  dropout: 0.1
  activation: relu

data:
  name: moons
  n_samples: 4000
  noise: 0.2
  val_split: 0.2
  batch_size: 128
  num_workers: 0

train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  patience: 8
